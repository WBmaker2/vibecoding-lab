name: Sync Static Gallery
run-name: "Sync Static Gallery :: ${{ inputs.request_marker }}"

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production base URL for materializing internal thumbnails
        required: false
        default: https://www.vivehong.shop
      reason:
        description: Reason for starting this sync
        required: false
        default: admin-button
      request_marker:
        description: Public correlation marker for this sync request
        required: true

permissions:
  contents: write

concurrency:
  group: static-gallery-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.base_url || 'https://www.vivehong.shop' }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      SYNC_REASON: ${{ inputs.reason || 'admin-button' }}
      SYNC_REQUEST_MARKER: ${{ inputs.request_marker }}
    steps:
      - name: Checkout dispatch ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Show sync request
        run: |
          echo "Reason: $SYNC_REASON"
          echo "Request marker: $SYNC_REQUEST_MARKER"
          echo "Base URL: $BASE_URL"

      - name: Export static gallery snapshot
        run: npm run apps:export-static-gallery -- --base-url "$BASE_URL"

      - name: Detect generated gallery changes
        id: changes
        run: |
          if [[ -z "$(git status --porcelain -- src/data/public-apps.json public/app-thumbnails)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Static gallery export is unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Static gallery export changed."
          fi

      - name: Verify static gallery snapshot
        if: steps.changes.outputs.changed == 'true'
        run: npm run apps:verify-static-gallery

      - name: Run focused tests
        if: steps.changes.outputs.changed == 'true'
        run: npm test -- scripts/lib/static-gallery-export-state.test.mjs scripts/apps-export-static-gallery.fixture.test.mjs src/lib/apps/static-public-apps.test.ts src/app/__tests__/home-shell.test.tsx src/app/api/admin/sync-static-gallery/route.test.ts src/features/admin/admin-workspace.test.tsx

      - name: Lint
        if: steps.changes.outputs.changed == 'true'
        run: npm run lint

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Check generated diff
        if: steps.changes.outputs.changed == 'true'
        run: git diff --check

      - name: Commit generated gallery files
        id: commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/public-apps.json public/app-thumbnails
          git commit -m "chore: sync static gallery"

      - name: Push generated gallery files
        if: steps.changes.outputs.changed == 'true'
        run: git push

      - name: Summarize no-op sync
        if: steps.changes.outputs.changed == 'false'
        run: |
          {
            echo "## Static gallery sync"
            echo
            echo "No generated gallery changes detected; verification, commit, push, and Vercel Git deployment were skipped."
          } >> "$GITHUB_STEP_SUMMARY"
